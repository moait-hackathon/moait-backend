# 테스트 기본 프로파일 - 인메모리 H2 (실제 DB 불필요)
# 실 DB 동작 검증이 필요한 통합 테스트는 Testcontainers 사용 권장 (AGENTS.md)

spring.datasource.url=jdbc:h2:mem:moai;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# External AI calls are disabled in automated tests.
spring.ai.model.chat=none
spring.ai.openai.api-key=disabled

springdoc.api-docs.enabled=false

# JWT (테스트 고정값)
jwt.secret=moait-test-secret-key-for-junit-only-0123456789abcdef
jwt.access-token-validity-seconds=3600
jwt.refresh-token-validity-seconds=1209600
