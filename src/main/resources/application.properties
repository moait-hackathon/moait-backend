spring.application.name=moai

# 기본 프로필: 로컬 개발. 운영 배포는 SPRING_PROFILES_ACTIVE=prod 환경변수가 덮어씀
# (Dockerfile / docker-compose.yml 에서 주입)
spring.profiles.active=local

# springdoc / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Spring AI / OpenAI (disabled unless explicitly enabled)
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
# Placeholder only lets non-chat auto-config initialize while chat is disabled; it is never sent.
spring.ai.openai.api-key=${OPENAI_API_KEY:disabled}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2

# JWT
# secret 은 개발 기본값. 운영은 application-prod 에서 JWT_SECRET 환경변수로 덮어씀 (AGENTS.md 규칙 9)
jwt.secret=moait-local-development-secret-key-change-me-please-0123456789
jwt.access-token-validity-seconds=3600
jwt.refresh-token-validity-seconds=1209600
